[build]
  publish = "."
  command = "node scripts/generate-config.js"

[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200

[[redirects]]
  from = "/boutique"
  to = "/boutique.html"
  status = 200

[[redirects]]
  from = "/produit/:slug"
  to = "/product.html?slug=:slug"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
